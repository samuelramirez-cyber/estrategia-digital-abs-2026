<style>
  :root{
    --navy-950:#060D1A;
    --navy-900:#0A192F;
    --card-navy:#0F2342;
    --border-blue:#1E3A8A;
    --abs-red:#C8102E;
    --abs-cyan:#00D2FF;
    --silver:#94A3B8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--navy-950);
    color:#fff;
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
  }
  .font-display{font-family:'Oswald',system-ui,sans-serif;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-blue);border-radius:8px;}
  ::selection{background:var(--abs-red);color:#fff;}

  #bg-fx{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 1000px 600px at 15% -10%, rgba(0,210,255,.10), transparent 60%),
      radial-gradient(ellipse 900px 700px at 110% 20%, rgba(200,16,46,.14), transparent 55%),
      radial-gradient(ellipse 800px 800px at 50% 120%, rgba(0,210,255,.06), transparent 60%),
      linear-gradient(var(--navy-950), var(--navy-950));
  }
  #bg-grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
    background-image:
      linear-gradient(rgba(148,163,184,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,.06) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(ellipse 90% 80% at 50% 40%, black, transparent 90%);
  }

  #topbar{
    position:fixed;top:0;left:0;right:0;height:64px;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 clamp(16px,4vw,48px);
    background:rgba(6,13,26,.72);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(30,58,138,.4);
  }
  #progress-track{
    position:fixed;top:64px;left:0;right:0;height:3px;z-index:40;
    background:rgba(148,163,184,.12);
  }
  #progress-fill{
    height:100%;width:10%;
    background:linear-gradient(90deg,var(--abs-red),var(--abs-cyan));
    transition:width .5s cubic-bezier(.65,0,.35,1);
  }

  #stage{
    position:absolute;top:67px;left:0;right:0;bottom:0;z-index:10;
  }
  .slide{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    opacity:0;visibility:hidden;pointer-events:none;
    transform:translateX(24px) scale(.99);
    transition:opacity .45s ease, transform .45s ease, visibility 0s linear .45s;
    overflow-y:auto;overflow-x:hidden;
    padding:clamp(20px,4vw,56px) clamp(20px,6vw,90px) 100px;
  }
  .slide.active{
    opacity:1;visibility:visible;pointer-events:auto;
    transform:translateX(0) scale(1);
    transition:opacity .45s ease, transform .45s ease, visibility 0s linear 0s;
  }
  .slide.prev{transform:translateX(-24px) scale(.99);}

  .nav-btn{
    position:fixed;top:50%;transform:translateY(-50%);z-index:45;
    width:48px;height:48px;border-radius:9999px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(15,35,66,.85);border:1px solid rgba(30,58,138,.6);
    color:#fff;backdrop-filter:blur(6px);
    transition:all .2s ease;cursor:pointer;
  }
  .nav-btn:hover:not(:disabled){background:var(--abs-red);border-color:var(--abs-red);transform:translateY(-50%) scale(1.08);}
  .nav-btn:disabled{opacity:.25;cursor:not-allowed;}
  #btn-prev{left:clamp(8px,2vw,28px);}
  #btn-next{right:clamp(8px,2vw,28px);}

  #dotbar{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:45;
    display:flex;gap:8px;padding:8px 14px;border-radius:9999px;
    background:rgba(15,35,66,.75);border:1px solid rgba(30,58,138,.5);backdrop-filter:blur(6px);
  }
  .dot{width:8px;height:8px;border-radius:9999px;background:rgba(148,163,184,.4);cursor:pointer;transition:all .25s ease;}
  .dot:hover{background:var(--abs-cyan);}
  .dot.active{width:22px;background:var(--abs-red);}

  .glass-card{
    background:var(--card-navy);background:rgba(15,35,66,.9);
    border:1px solid rgba(30,58,138,.5);
    border-radius:16px;
  }
  .acc-header{cursor:pointer;user-select:none;}
  .acc-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.65,0,.35,1);}
  .acc-chevron{transition:transform .3s ease;}
  .acc-item.open .acc-chevron{transform:rotate(180deg);}
  .acc-item.open .acc-header{border-bottom:1px solid rgba(30,58,138,.5);}

  .tag-pill{
    font-family:'Oswald',sans-serif;letter-spacing:.12em;font-size:11px;
    padding:4px 12px;border-radius:9999px;font-weight:600;
  }
  .kicker{letter-spacing:.2em;font-size:12px;font-weight:600;color:var(--silver);}

  .pillar-house{transition:transform .25s ease, filter .25s ease;cursor:pointer;}
  .pillar-house:hover{transform:translateY(-6px);filter:brightness(1.15);}
  .pillar-house{min-width:90px;}

  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .float{animation:floaty 5s ease-in-out infinite;}

  .grad-text{background:linear-gradient(90deg,#C8102E,#00D2FF);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .funnel-box{background:linear-gradient(135deg,#0F2342,#060D1A);}

  @media (max-width:768px){
    .nav-btn{width:38px;height:38px;}
    #topbar{height:56px;}
    #progress-track{top:56px;}
    #stage{top:59px;}
  }

];

const stage = document.getElementById("stage");

const dotbar = document.getElementById("dotbar");
dotbar.innerHTML = SLIDES.map((_,i)=>`<span class="dot" data-goto="${i+1}"></span>`).join("");

lucide.createIcons();

/* =========================================================
   NAVIGATION
========================================================= */
const TOTAL = SLIDES.length;
let current = 1;
const slideEls = () => document.querySelectorAll(".slide");
const dotEls = () => document.querySelectorAll(".dot");
const btnPrev = document.getElementById("btn-prev");
const btnNext = document.getElementById("btn-next");
const counter = document.getElementById("slide-counter");
const progressFill = document.getElementById("progress-fill");

function showSlide(n){
  n = Math.max(1, Math.min(TOTAL, n));
  slideEls().forEach(el=>{
    const idx = parseInt(el.id.split("-")[1],10);
    el.classList.toggle("active", idx===n);
    el.classList.toggle("prev", idx<n);
  });
  dotEls().forEach((d,i)=> d.classList.toggle("active", i+1===n));
  counter.innerHTML = `SLIDE ${String(n).padStart(2,"0")} <span class="text-white">DE ${TOTAL}</span>`;
  progressFill.style.width = (n/TOTAL*100)+"%";
  btnPrev.disabled = n===1;
  btnNext.disabled = n===TOTAL;
  current = n;
}

function next(){ showSlide(current+1); }
function prev(){ showSlide(current-1); }

btnNext.addEventListener("click", next);
btnPrev.addEventListener("click", prev);

document.addEventListener("keydown", (e)=>{
  if(e.key==="ArrowRight" || e.key==="PageDown"){ next(); }
  else if(e.key==="ArrowLeft" || e.key==="PageUp"){ prev(); }
  else if(e.key==="Home"){ showSlide(1); }
  else if(e.key==="End"){ showSlide(TOTAL); }
});

dotbar.addEventListener("click",(e)=>{
  const dot = e.target.closest(".dot");
  if(dot) showSlide(parseInt(dot.dataset.goto,10));
});

/* Accordion toggle (event delegation, works for dynamically injected slides) */
document.addEventListener("click",(e)=>{
  const header = e.target.closest(".acc-header");
  if(!header) return;
  const item = header.closest(".acc-item");
  const body = item.querySelector(".acc-body");
  const isOpen = item.classList.contains("open");
  if(isOpen){
    body.style.maxHeight = null;
    item.classList.remove("open");
  } else {
    item.classList.add("open");
    body.style.maxHeight = body.scrollHeight + "px";
  }
});

/* Basic swipe support (touch devices) */
let touchX = null;
document.addEventListener("touchstart", e=>{ touchX = e.touches[0].clientX; }, {passive:true});
document.addEventListener("touchend", e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 60){ dx < 0 ? next() : prev(); }
  touchX = null;
}, {passive:true});

showSlide(1);
</script>
